name: Frontend CI

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main, release/*]

jobs:
  verify:
    name: Lint, Typecheck, Test, and E2E Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Code Quality (Lint)
        run: npm --prefix frontend run lint

      - name: Static Typecheck (tsc)
        run: npm --prefix frontend run typecheck

      - name: Unit & Component Coverage Tests (Vitest)
        run: npm --prefix frontend run test:coverage

      - name: Install Playwright Browsers
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: End-to-End & WCAG 2.1 AA Accessibility Tests (Playwright)
        run: npm --prefix frontend run test:e2e

      - name: Production Bundle Build
        run: npm --prefix frontend run build
