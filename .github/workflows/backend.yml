name: Backend CI

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main, release/*]

jobs:
  test:
    name: Unit Tests & Secret Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio pytest-cov

      - name: Run Secret Audit across git history
        run: python scripts/secret_scan.py

      - name: Run Unit Tests
        env:
          PYTHONPATH: backend
        run: pytest backend/tests/unit -v
